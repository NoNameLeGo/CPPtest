<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%">
  <title>CPPtest — C++ 练手项目集</title>
  <desc>CPPtest 仓库主页 Hero Banner：展示项目名称、统计信息、技术栈和一个 C++ 代码示例</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="50%" stop-color="#131a2e"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#569cd6"/>
      <stop offset="100%" stop-color="#4ec9b0"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2640" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a2238" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Code line shimmer -->
    <linearGradient id="lineShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#569cd6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4ec9b0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#569cd6" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glow filter for primary text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Card backdrop -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="0"/>

  <!-- Subtle grid pattern -->
  <g stroke="#1a2340" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
  </g>

  <!-- Decorative angle brackets (C++ motif) -->
  <text x="55" y="85" font-family="Consolas, 'Courier New', monospace" font-size="48" fill="#569cd6" opacity="0.08">&lt;CPPtest&gt;</text>
  <text x="1040" y="385" font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#569cd6" opacity="0.06">// end</text>

  <!-- Left Section: Title + Description -->
  <g transform="translate(48, 48)">
    <!-- Small badge label -->
    <rect x="0" y="0" width="120" height="24" rx="4" fill="url(#accentGrad)" opacity="0.2"/>
    <text x="60" y="17" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" fill="#4ec9b0" text-anchor="middle" font-weight="600">C++ 练手项目集</text>

    <!-- Main title -->
    <rect x="0" y="42" width="540" height="1" fill="url(#lineShimmer)"/>
    <text x="0" y="92" font-family="Consolas, 'Courier New', monospace" font-size="48" fill="#d4d4d4" font-weight="700" letter-spacing="1">CPPtest</text>

    <!-- Subtitle -->
    <text x="0" y="122" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#6a7a8e" letter-spacing="0.5">
      从基础语法到 OOP，用代码记录 C++ 学习之旅
    </text>

    <!-- Stats row -->
    <g transform="translate(0, 152)">
      <!-- Project count -->
      <rect x="0" y="0" width="130" height="44" rx="8" fill="url(#cardBg)" stroke="#2a3350" stroke-width="0.8"/>
      <text x="16" y="18" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#569cd6" font-weight="600">25+</text>
      <text x="16" y="34" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6a7a8e">独立项目</text>

      <!-- Topics count -->
      <rect x="144" y="0" width="130" height="44" rx="8" fill="url(#cardBg)" stroke="#2a3350" stroke-width="0.8"/>
      <text x="160" y="18" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#4ec9b0" font-weight="600">15+</text>
      <text x="160" y="34" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6a7a8e">C++ 知识点</text>

      <!-- Commits -->
      <rect x="288" y="0" width="130" height="44" rx="8" fill="url(#cardBg)" stroke="#2a3350" stroke-width="0.8"/>
      <text x="304" y="18" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ce9178" font-weight="600">67</text>
      <text x="304" y="34" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6a7a8e">累计提交</text>
    </g>

    <!-- Topic tags -->
    <g transform="translate(0, 220)">
      <text x="0" y="12" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#6a7a8e">核心知识点</text>
      <!-- Tags row 1 -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="88" height="24" rx="12" fill="#569cd6" opacity="0.15"/>
        <text x="44" y="16" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#569cd6" text-anchor="middle" font-weight="500">类与对象</text>

        <rect x="96" y="0" width="76" height="24" rx="12" fill="#4ec9b0" opacity="0.15"/>
        <text x="134" y="16" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#4ec9b0" text-anchor="middle" font-weight="500">继承</text>

        <rect x="180" y="0" width="88" height="24" rx="12" fill="#c586c0" opacity="0.15"/>
        <text x="224" y="16" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#c586c0" text-anchor="middle" font-weight="500">多态</text>

        <rect x="276" y="0" width="100" height="24" rx="12" fill="#ce9178" opacity="0.15"/>
        <text x="326" y="16" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#ce9178" text-anchor="middle" font-weight="500">函数重载</text>
      </g>
      <!-- Tags row 2 -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="88" height="24" rx="12" fill="#dcdcaa" opacity="0.15"/>
        <text x="44" y="16" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#dcdcaa" text-anchor="middle" font-weight="500">文件 I/O</text>

        <rect x="96" y="0" width="100" height="24" rx="12" fill="#6a9955" opacity="0.15"/>
        <text x="146" y="16" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6a9955" text-anchor="middle" font-weight="500">静态绑定</text>

        <rect x="204" y="0" width="110" height="24" rx="12" fill="#569cd6" opacity="0.15"/>
        <text x="259" y="16" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#569cd6" text-anchor="middle" font-weight="500">多重继承</text>

        <rect x="322" y="0" width="100" height="24" rx="12" fill="#4ec9b0" opacity="0.15"/>
        <text x="372" y="16" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#4ec9b0" text-anchor="middle" font-weight="500">VR 系列</text>
      </g>
    </g>

    <!-- Build info -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="540" height="1" fill="#1e2640"/>
      <g transform="translate(0, 14)">
        <circle cx="5" cy="-3" r="3" fill="#4ec9b0" opacity="0.6"/>
        <text x="16" y="3" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6a7a8e">工具链：Visual Studio 2022 · C++20 · MSBuild</text>
      </g>
      <g transform="translate(0, 34)">
        <circle cx="5" cy="-3" r="3" fill="#569cd6" opacity="0.6"/>
        <text x="16" y="3" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6a7a8e">平台：Win32 / x64 · Debug / Release</text>
      </g>
    </g>
  </g>

  <!-- Right Section: Code Snippet Panel -->
  <g transform="translate(640, 48)">
    <!-- Code panel frame -->
    <rect x="0" y="0" width="512" height="324" rx="10" fill="#0d111a" stroke="#2a3350" stroke-width="1.2"/>
    
    <!-- Window controls -->
    <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="20" r="5" fill="#27c93f"/>
    
    <!-- Code line numbers -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#4a4f63" text-anchor="end">
      <text x="24" y="52">1</text>
      <text x="24" y="72">2</text>
      <text x="24" y="92">3</text>
      <text x="24" y="112">4</text>
      <text x="24" y="132">5</text>
      <text x="24" y="152">6</text>
      <text x="24" y="172">7</text>
      <text x="24" y="192">8</text>
      <text x="24" y="212">9</text>
      <text x="24" y="232">10</text>
      <text x="24" y="252">11</text>
      <text x="24" y="272">12</text>
      <text x="24" y="292">13</text>
    </g>

    <!-- Code content -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="12">
      <!-- Line 1: #include -->
      <text x="40" y="52" fill="#c586c0">#include</text>
      <text x="98" y="52" fill="#ce9178">&lt;iostream&gt;</text>
      
      <!-- Line 2: using namespace -->
      <text x="40" y="72" fill="#569cd6">using</text>
      <text x="76" y="72" fill="#569cd6">namespace</text>
      <text x="144" y="72" fill="#d4d4d4">std;</text>
      
      <!-- Line 3: blank -->
      <!-- Line 4: class Volume { -->
      <text x="40" y="112" fill="#569cd6">class</text>
      <text x="80" y="112" fill="#4ec9b0">Volume</text>
      <text x="128" y="112" fill="#d4d4d4">{</text>
      
      <!-- Line 5: private: -->
      <text x="60" y="132" fill="#569cd6">private</text>
      <text x="120" y="132" fill="#d4d4d4">:</text>
      
      <!-- Line 6: double l, w, h; -->
      <text x="80" y="152" fill="#569cd6">double</text>
      <text x="132" y="152" fill="#d4d4d4">length, width, height;</text>
      
      <!-- Line 7: public: -->
      <text x="60" y="172" fill="#569cd6">public</text>
      <text x="112" y="172" fill="#d4d4d4">:</text>
      
      <!-- Line 8: // constructor -->
      <text x="80" y="192" fill="#6a9955">// 计算长方体体积</text>
      
      <!-- Line 9: double getVolume() -->
      <text x="80" y="212" fill="#569cd6">double</text>
      <text x="132" y="212" fill="#dcdcaa">getVolume</text>
      <text x="196" y="212" fill="#d4d4d4">() {</text>
      
      <!-- Line 10: return l * w * h; -->
      <text x="100" y="232" fill="#569cd6">return</text>
      <text x="148" y="232" fill="#d4d4d4">length * width * height;</text>
      
      <!-- Line 11: } -->
      <text x="80" y="252" fill="#d4d4d4">}</text>
      
      <!-- Line 12: }; -->
      <text x="40" y="272" fill="#d4d4d4">};</text>

      <!-- Line 13: // Output: 长方体的体积为: 24 -->
      <text x="40" y="292" fill="#6a9955">// Output: 长方体的体积为: 24</text>
    </g>

    <!-- Cursor blink -->
    <rect x="324" y="226" width="8" height="14" rx="1" fill="#d4d4d4" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Footer separator -->
  <line x1="48" y1="400" x2="1152" y2="400" stroke="#1e2640" stroke-width="1"/>
</svg>
